<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" role="img" aria-labelledby="title desc">
<title id="title">Nàng nhân ngư thư phòng THƯ CÁ</title><desc id="desc">Nàng tiên cá chibi tóc nâu xoăn, trang sức ngọc trai, đuôi cá xanh ngọc óng ánh, nằm bên chồng sách và mèo trắng đang ngủ.</desc>
